# Q-Prime NGINX - HTTP Only Configuration
# Used during initial setup before SSL certificates are obtained
#
# This config:
# - Serves ACME challenges for Let's Encrypt
# - Proxies to backend services over HTTP (for testing)
# - Does NOT redirect to HTTPS

# Upstream definitions
upstream frontend {
    server frontend:80;
    keepalive 32;
}

upstream convex_api {
    server convex-backend:3210;
    keepalive 32;
}

upstream convex_site {
    server convex-backend:3211;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Root - Redirect to /ohq/
    location = / {
        return 302 /ohq/;
    }

    # Frontend Routes - /ohq/*
    location /ohq/ {
        rewrite ^/ohq/(.*) /$1 break;
        proxy_pass http://frontend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ohq {
        return 302 /ohq/;
    }

    # Convex HTTP Actions - CSV endpoints (keep /api/ prefix, backend expects it)
    location ~ ^/api/(download_|upload_) {
        proxy_pass http://convex_site;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Convex Auth Routes (keep /api/ prefix, backend expects it)
    location /api/auth/ {
        proxy_pass http://convex_site;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Convex API Routes - Main API with WebSocket
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://convex_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # OpenID Connect Discovery
    location /.well-known/openid-configuration {
        proxy_pass http://convex_site/.well-known/openid-configuration;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /.well-known/jwks.json {
        proxy_pass http://convex_site/.well-known/jwks.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
