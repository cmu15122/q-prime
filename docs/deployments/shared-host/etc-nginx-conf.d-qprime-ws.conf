# Deploy to: /etc/nginx/conf.d/qprime-ws.conf
#
# WebSocket connection-upgrade map used by the NEW Convex /api/ proxy block.
# Lives in conf.d (http{} context) because a `map` cannot sit inside server{}.
# The stock host nginx.conf already does `include /etc/nginx/conf.d/*.conf;`.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
